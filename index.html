<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Irremarkables — pick a superpower, place your bet, survive the lobby." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <title>Irremarkables</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="gl"></canvas>

    <!-- ===================== MENU ===================== -->
    <div id="menu" class="screen">
      <div class="menu-top">
        <h1 class="title">IRRE<span>MARKABLES</span></h1>
        <p class="tagline">pick a power &middot; place your bet &middot; outlive the lobby</p>
      </div>

      <div class="menu-mid">
        <div class="power-carousel">
          <button id="power-prev" class="carousel-btn" aria-label="previous power">&#9664;</button>
          <div class="power-card" id="power-card">
            <div class="power-emblem" id="power-emblem"></div>
            <div class="power-name" id="power-name"></div>
            <div class="power-desc" id="power-desc"></div>
            <div class="power-rare" id="power-rare">RARE</div>
          </div>
          <button id="power-next" class="carousel-btn" aria-label="next power">&#9654;</button>
        </div>
        <div class="power-dots" id="power-dots"></div>
      </div>

      <div class="menu-bottom">
        <div class="bet-row">
          <div class="bet-label">BET</div>
          <div class="bet-options" id="bet-options"></div>
        </div>
        <button id="play-btn" class="play-btn">DROP IN</button>
        <div class="wallet-row">
          <span class="wallet-label">WALLET</span>
          <span class="wallet-value" id="wallet-value">$0</span>
          <button id="sound-btn" class="sound-btn" aria-label="toggle sound">&#128266;</button>
        </div>
      </div>
    </div>

    <!-- ===================== HUD ===================== -->
    <div id="hud" class="screen hidden">
      <div class="hud-topleft">
        <div class="leaderboard" id="leaderboard"></div>
        <div class="killfeed" id="killfeed"></div>
      </div>
      <div class="hud-topright">
        <div class="total-box">
          <div class="total-value" id="total-value">$0.00</div>
          <div class="total-mult" id="total-mult">0.00&times;</div>
        </div>
        <div class="hp-bar"><div class="hp-fill" id="hp-fill"></div></div>
        <div class="buff-row" id="buff-row"></div>
      </div>

      <div class="hud-bottomleft">
        <button id="switch-btn" class="pill-btn">SWITCH <span id="switch-count">3</span></button>
      </div>

      <div class="hud-bottomright">
        <button id="attack-btn" class="action-btn attack-btn"><span>ATTACK</span></button>
        <button id="poweruse-btn" class="action-btn power-btn">
          <svg class="cd-ring" viewBox="0 0 100 100"><circle id="cd-circle" cx="50" cy="50" r="46"/></svg>
          <span id="poweruse-icon">&#9889;</span>
        </button>
      </div>

      <div class="keys-hint" id="keys-hint">WASD move &middot; M attack &middot; SPACE power &middot; TAB switch &middot; drag to look</div>

      <div id="joystick" class="joystick hidden">
        <div class="joy-base"></div>
        <div class="joy-knob" id="joy-knob"></div>
      </div>

      <div id="announce" class="announce hidden"></div>
      <div id="vignette" class="vignette"></div>
      <div id="flash" class="flash"></div>
    </div>

    <!-- ===================== SWITCH OVERLAY ===================== -->
    <div id="switch-overlay" class="screen overlay hidden">
      <div class="overlay-title">SWITCH POWER <span id="switch-left-label"></span></div>
      <div class="switch-grid" id="switch-grid"></div>
      <button id="switch-cancel" class="pill-btn">CANCEL</button>
    </div>

    <!-- ===================== RESULTS ===================== -->
    <div id="results" class="screen overlay hidden">
      <div class="results-card">
        <div class="results-title" id="results-title">ELIMINATED</div>
        <div class="results-killer" id="results-killer"></div>
        <div class="results-payout" id="results-payout">$0.00</div>
        <div class="results-mult" id="results-mult">0.00&times;</div>
        <div class="results-stats" id="results-stats"></div>
        <button id="results-btn" class="play-btn">BACK TO LOBBY</button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
